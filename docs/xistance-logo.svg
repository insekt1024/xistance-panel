<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Xistance Panel logo">
  <defs>
    <linearGradient id="xp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1a38"/>
      <stop offset="1" stop-color="#0d0b18"/>
    </linearGradient>
    <linearGradient id="xp-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="xp-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#xp-bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- data beam passing through the portal -->
  <rect x="56" y="238" width="400" height="36" rx="18" fill="url(#xp-beam)" opacity="0.9"/>
  <path d="M404 218 L464 256 L404 294 Z" fill="#22d3ee"/>
  <!-- portal rings -->
  <circle cx="256" cy="256" r="122" fill="none" stroke="url(#xp-ring)" stroke-width="30"/>
  <circle cx="256" cy="256" r="74" fill="none" stroke="url(#xp-ring)" stroke-width="14" opacity="0.55"/>
  <circle cx="256" cy="256" r="36" fill="#0d0b18" stroke="url(#xp-ring)" stroke-width="10"/>
  <!-- relay node at the center -->
  <circle cx="256" cy="256" r="13" fill="#ffffff"/>
</svg>
