name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Turbopack chokes on tunnels/bin/gost (os error 22); always build without it.
  TURBO_DISABLE: "true"

jobs:
  verify:
    name: Lint · Typecheck · Version · Tests
    runs-on: ubuntu-latest
    # Raised from 20: this job now builds two systemd base images, installs the
    # release onto four containers, and runs the real browser measurement
    # (157s on its own). 20 minutes was already close before any of that.
    timeout-minutes: 45
    # The arm64 payload is uploaded by the native arm64 job, because an x64
    # runner cannot produce one -- Prisma's query engine is generated on the
    # target architecture. Two suites verify a real arm64 ARCHIVE (its
    # checksum, and the embedded manifest digest against the tree it extracts
    # to), and on an x64 runner there is no arm64 archive for them to read.
    #
    # So the artifact is downloaded here rather than skipped. Before this, both
    # suites failed on a fresh CI checkout and passed locally, where an earlier
    # run had left an archive behind -- the same defect shape as the CI steps
    # that never cut an archive at all.
    needs: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build packages (incl. Prisma client)
        run: npm run build:packages

      - name: Version files in sync
        run: npm run version:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Optimization tests (temp SQLite DB)
        run: npx tsx scripts/test-optimizations.ts

      # The two Linux suites exercise the STAGED RELEASE PAYLOAD, not the source
      # tree. `verify` runs on ubuntu-latest, so they take their local path here
      # (no WSL) and need dist/artifact to exist. Before this step was added the
      # job had no build, so the aggregate died on every runner with
      # "cp: cannot stat .../dist/artifact" and 0/1 suites passed. The build and
      # staging therefore have to precede the suite, not live only in the
      # browser job.
      - name: Build (for the Linux payload suites)
        run: npm run build
        env:
          TURBO_DISABLE: "true"

      # Unpack the arm64 payload next to the amd64 one so the archive suites
      # have both. `merge-multiple: true` would flatten the directories; each
      # suite expects dist/arm64/ to hold the archive, its .sha256 and the
      # manifest beside it, so download the way the arm64 job uploaded it.
      - name: Download the arm64 payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arm64-payload-${{ github.sha }}
          path: dist/arm64

      - name: Stage the release artifact
        run: npx tsx scripts/stage-release-artifact.ts . dist/artifact --architecture amd64

      # Built AFTER staging, and over dist/artifact -- not over the standalone
      # tree. The manifest's artifact.sha256 must describe the tree the ARCHIVE
      # extracts to, because that is what test-embedded-manifest-provenance
      # recomputes and compares. CI passed apps/web/.next/standalone here while
      # the release workflow passed dist/artifact, so the digest CI recorded
      # could never describe the archive CI shipped.
      - name: Build release manifest
        run: |
          # Computed HERE, not in `env:` -- an env value is a literal string, so
          # `VERSION: $(node -p ...)` passes the text "$(node -p ...)" and the
          # manifest rejects it as a non-semantic version.
          VERSION="$(node -p "require('./package.json').version")"
          PRISMA_VERSION="$(node -p "require('./node_modules/prisma/package.json').version")"
          npx tsx scripts/release-manifest.ts build \
            dist/artifact/release-manifest.json \
            "$VERSION" \
            "${{ github.sha }}" \
            amd64 \
            "xistance-panel-v${VERSION}-amd64.tar.gz" \
            dist/artifact \
            "$PRISMA_VERSION"
          # The root copy is what the local verifiers are pointed at, and the
          # archive copy is what the archive contains. Writing only the root copy
          # meant `tar -C dist/artifact` shipped an archive with NO manifest in
          # it, so the embedded-provenance gate failed on every run.
          cp dist/artifact/release-manifest.json release-manifest.json

      # Archive the staged tree BEFORE the suites run.
      #
      # 14 suites read dist/amd64/*.tar.gz (and dist/arm64/*) -- manifest
      # freshness, embedded-manifest provenance, real-archive verify, rollback
      # drill, shipped-payload, release audit. Without this step CI staged the
      # tree and then ran suites that check the ARCHIVE, so every one of them
      # failed on a fresh checkout while passing locally, where a previous run
      # had left an archive behind. The archive, its checksum and the manifest
      # beside it are produced here in the order the suites read them.
      - name: Archive the staged artifact
        run: |
          # The name comes from the manifest that was just written, not from a
          # separately computed version: the suites that verify this archive
          # (real-archive-verify, manifest freshness, embedded provenance) resolve
          # the name from release-manifest.json, so deriving it from the same
          # source is what keeps the two from drifting.
          #
          # It also has to be v<version>, not v<sha>, which is what the release
          # workflow archives.
          #
          # No `env:` here on purpose: an env value is a literal string, so
          # `VERSION: $(node -p ...)` yields the text "$(node -p ...)" and the
          # filename silently becomes nonsense.
          ARCHIVE="dist/amd64/$(node -p \
            "require('./dist/artifact/release-manifest.json').artifact.name")"
          mkdir -p dist/amd64
          tar -czf "$ARCHIVE" -C dist/artifact .
          npx tsx scripts/release-manifest.ts sha256 "$ARCHIVE" > "$ARCHIVE.sha256"
          cp dist/artifact/release-manifest.json dist/amd64/release-manifest.json
          echo "archived $ARCHIVE"

      # The full local suite list. Before this step existed, this job ran
      # test-optimizations.ts and nothing else: 62 of 63 suites on disk were
      # never executed by CI, including every security suite. A critical SSH
      # option-injection finding shipped because the suite that catches it
      # passed locally and no one had put it in CI.
      #
      # `run-all-tests.ts` fails if a test-* file on disk is not registered in
      # it or in the browser gate, so a new suite cannot be added without
      # deciding where it runs.
      # test-dashboard-legibility does real browser measurement as well as source
      # guards. Without a browser it prints
      #   browser measurement SKIPPED (no playwright resolvable)
      # and the legibility claim rests on source inspection alone. That is a
      # silent skip in the exact sense the aggregate forbids: "A suite that
      # cannot run is a FAILURE, not a skip."
      #
      # The browser gate installs Chromium, but this suite runs HERE, in a
      # different job on a different runner -- so the install has to be here too.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # test-rollback-drill and test-target-runs-shipped-payload need real target
      # OSes: Ubuntu 22.04.5 and 24.04.5, systemd as PID 1, with the shipped
      # release installed and serving. Until now those were containers a
      # developer had built by hand, so they passed locally and failed here with
      # "target is reachable: docker exec xtinst true failed". Runners DO have
      # Docker; they just had nothing that created these two.
      #
      # Creating them turns a skip into a real execution. It does not make any
      # suite more permissive: a suite still SKIPS when Docker is absent and
      # still FAILS when Docker is present but a target is missing.
      - name: Create the real target OSes
        run: bash scripts/create-target-os.sh

      - name: Full local test suite
        run: npx tsx scripts/run-all-tests.ts

      - name: Dependency audit (high+ blocks; one documented waiver)
        # Was `continue-on-error: true`, which meant a high advisory could never
        # fail the build while the task required no unresolved high/critical.
        # It later became `npm audit --audit-level=high`, which BLOCKS -- and
        # which turned permanently red on GHSA-vfj7-8cjw-p6xm (braces, CWE-674).
        #
        # That advisory is unFIXABLE, not unfixed: braces@3.0.3 is the latest
        # release, eslint-config-next 16.3.8 is still vulnerable, npm's only
        # remedy is downgrading to 14.2.35 (a semver-major BACKWARDS move on a
        # Next 16 project), and micromatch hard-depends on braces ^3.0.3 so
        # `overrides` cannot route around it. fixAvailable: None.
        #
        # The PRD permits exactly one escape -- "Release is blocked by ...
        # undocumented waiver" -- so the waiver is made DOCUMENTED and MACHINE
        # CHECKED rather than remembered: scripts/audit-gate.sh pins the exact
        # advisory set, always audits the shipped tree with --omit=dev, and
        # refuses anything new. scripts/test-audit-gate.ts proves it can still
        # FAIL, including refusing to waive a CRITICAL advisory.
        #
        # Deliberately NOT `--omit=dev` alone: that would drop dev advisories with
        # no record of which ones were accepted. The js-yaml advisory this gate
        # caught was dev-only, so dev coverage has to stay.
        run: bash scripts/audit-gate.sh

  # The browser gate (TASK-56). Runs the real suites against a real production
  # build, and against the STAGED artifact rather than the source tree, because
  # Next's standalone output excludes public/ and .next/static -- a source-tree
  # server would pass while the release payload 404s every stylesheet.
  #
  # `npm run test:browser` exits 77 when a suite cannot run here, which CI treats
  # as a FAILURE. That is deliberate: on ubuntu-latest Chromium is available, so
  # a skip means something is actually missing, and a silently skipped browser
  # gate is how "browser coverage" gets claimed when nothing ran.
  # ------------------------------------------------------------------ arm64 --
  # Build the arm64 payload on a NATIVE arm64 runner.
  #
  # This exists because the arm64 release gate could not be closed any other
  # way: Prisma's query engine is a NATIVE binary generated on the target
  # architecture, so an x64 runner cannot produce an arm64 payload at all -- and
  # this host has neither binfmt-QEMU nor an arm64 builder. The release
  # workflow has an arm64 cell, but it only runs after a tag.
  #
  # So the tag was the only thing standing between this job and real arm64
  # evidence. This job removes that dependency: it builds, stages, manifests,
  # archives, checksums and INSPECTS an arm64 artifact on every push, and
  # proves the payload is installable-shaped before any release exists.
  #
  # It deliberately does NOT install. Native installation is the release
  # workflow's arm64 install gate, which runs on the same runner class but
  # after the tag. What this job removes is the "arm64 has never been built
  # anywhere" gap; it does not claim to close the native-install gate.
  arm64:
    name: Arm64 payload (native runner)
    # ubuntu-24.04-arm is GitHub-hosted and free for public repositories. This
    # repository is public; on a private one this label is unavailable and the
    # job would queue forever, which is why the runner class is named here
    # rather than hardcoded to a self-hosted label.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Report runner architecture
        run: |
          echo "uname -m: $(uname -m)"
          echo "dpkg arch: $(dpkg --print-architecture)"
          # A cross-built payload would carry an x64 query engine and fail the
          # inspect step below. Failing HERE says why, instead of later.
          test "$(uname -m)" = "aarch64" || {
            echo "::error::expected an aarch64 runner, got $(uname -m)"
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Generates the Prisma client ON this architecture. On x64 this produces
      # libquery_engine-linux (x64); here it produces the arm64 engine, which is
      # the whole reason the job exists.
      - name: Build packages (incl. native Prisma engine)
        run: npm run build:packages

      - name: Build standalone output
        run: npm run build
        env:
          TURBO_DISABLE: "true"

      - name: Stage public and static assets
        run: npx tsx scripts/stage-release-assets.ts

      # The stager REQUIRES release-manifest.json at the repo root, copies it
      # into the staged tree, and then inspects it. The repository's committed
      # manifest says amd64, so staging arm64 against it fails:
      #
      #   Release manifest architecture mismatch: expected arm64
      #
      # amd64 only works today because that committed file happens to match the
      # architecture being built. The release workflow's arm64 cell would fail
      # the same way -- this is a latent release blocker, not something the new
      # job introduced.
      #
      # So seed an arm64 manifest first. Its digest is provisional, and that is
      # fine: stagedPayloadDigest excludes release-manifest.json, because a file
      # cannot contain its own hash. The real one is written after staging.
      - name: Seed the arm64 release manifest
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PRISMA_VERSION="$(node -p "require('./node_modules/prisma/package.json').version")"
          npx tsx scripts/release-manifest.ts build \
            release-manifest.json \
            "$VERSION" \
            "${{ github.sha }}" \
            arm64 \
            "xistance-panel-v${VERSION}-arm64.tar.gz" \
            apps/web/.next/standalone \
            "$PRISMA_VERSION"

      - name: Stage the arm64 artifact
        run: npx tsx scripts/stage-release-artifact.ts . dist/artifact --architecture arm64

      # Same ordering as the release workflow, and for the same reason: the
      # manifest must describe the tree that is actually archived.
      - name: Build release manifest
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PRISMA_VERSION="$(node -p "require('./node_modules/prisma/package.json').version")"
          npx tsx scripts/release-manifest.ts build \
            dist/artifact/release-manifest.json \
            "$VERSION" \
            "${{ github.sha }}" \
            arm64 \
            "xistance-panel-v${VERSION}-arm64.tar.gz" \
            dist/artifact \
            "$PRISMA_VERSION"
          cp dist/artifact/release-manifest.json release-manifest.json

      - name: Inspect the arm64 artifact
        run: npx tsx scripts/inspect-release-artifact.ts dist/artifact --architecture arm64

      - name: Archive + checksum
        run: |
          ARCHIVE="dist/arm64/$(node -p \
            "require('./dist/artifact/release-manifest.json').artifact.name")"
          mkdir -p dist/arm64
          tar -czf "$ARCHIVE" -C dist/artifact .
          npx tsx scripts/release-manifest.ts sha256 "$ARCHIVE" > "$ARCHIVE.sha256"
          # The provenance step below reads the manifest from BESIDE the archive.
          # Without this copy it read the ROOT copy -- which, on this job, is the
          # provisional seed written before staging, carrying the pre-staging
          # digest. So it compared a stale digest against the real tree and
          # failed. The staged copy is the one that describes the archive.
          cp dist/artifact/release-manifest.json dist/arm64/release-manifest.json
          echo "built $ARCHIVE"

      # The manifest's digest is only provenance if it covers the tree the
      # archive extracts to. Recomputing it here is the same check the release
      # workflow performs, run on arm64 rather than amd64.
      - name: Verify the embedded digest describes the archive
        run: |
          ARCHIVE="$(ls dist/arm64/*.tar.gz)"
          SCRATCH="$(mktemp -d)"
          tar -xzf "$ARCHIVE" -C "$SCRATCH"
          npx tsx scripts/test-embedded-manifest-provenance.ts \
            --extract-dir "$SCRATCH" --manifest dist/arm64/release-manifest.json \
            --expect-version "$(node -p "require('./package.json').version")" \
            --expect-arch arm64

      - name: Confirm the payload carries an arm64 query engine
        run: |
          # The failure this prevents: an arm64-named archive holding an x64
          # engine, which installs and then cannot open its database.
          ENGINES="$(find dist/artifact -name 'libquery_engine*' -o -name 'query_engine*' | head -5)"
          echo "$ENGINES"
          if [ -z "$ENGINES" ]; then
            echo "::error::no Prisma query engine found in the arm64 payload"
            exit 1
          fi
          if echo "$ENGINES" | grep -qiE 'windows|darwin|musl'; then
            echo "::error::arm64 payload carries a non-Linux query engine"
            exit 1
          fi
          # A file(1) reading of the shipped engine is the direct check that it
          # is an aarch64 ELF, independent of what it was named.
          SAMPLE="$(echo "$ENGINES" | head -1)"
          file "$SAMPLE" || true

      # The same install gate the release workflow runs on its arm64 cell
      # (step "Install the archive on this architecture"), executed on every push
      # instead of only after a tag. This is what closes TASK-119: the arm64
      # artifact had never been installed by ANY process, because the only place
      # that did it was post-tag and the tag needed this evidence.
      #
      # Done before the upload, exactly as release.yml does it, so an
      # uninstallable payload fails the job rather than becoming an asset.
      - name: Install the arm64 archive (fail closed)
        run: |
          set -euo pipefail
          sudo -n true
          ARCHIVE=$(ls dist/arm64/*.tar.gz | head -1)
          echo "installing $ARCHIVE on $(uname -m)"
          # The archive was checksummed above; re-verify so the installer is
          # handed a payload proven identical to the one uploaded.
          (cd dist/arm64 && sha256sum -c "$(basename "$ARCHIVE").sha256")
          # Libraries must sit BESIDE the installer as $SCRIPT_DIR/lib. The
          # installer resolves release-layout.sh relative to its own directory and
          # dies with "Could not find release-layout.sh and service-unit.sh."
          # exit 7 otherwise.
          WORK="$(mktemp -d)"
          cp scripts/release-install.sh "$WORK/release-install.sh"
          mkdir -p "$WORK/lib"
          cp scripts/lib/release-layout.sh scripts/lib/service-unit.sh "$WORK/lib/"
          # The installer requires uid 0 for a real install and exits 4 without
          # it; a run: step is the unprivileged `runner` user.
          #
          # --version must be a `v`-prefixed semver TAG, not the bare version.
          # Passing 1.2.0 fails with:
          #   Invalid version '1.2.0'. Expected an explicit semver tag such as v1.2.0.
          # and exits 2 before extracting anything -- found by running this for
          # real. release.yml gets this right from the version job's output.
          sudo bash "$WORK/release-install.sh" \
            --version "v$(node -p "require('./package.json').version")" \
            --archive "$ARCHIVE"
          # Installed is not the same as serving.
          code=""
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8080/api/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || {
            echo "::error::arm64 release does not answer /api/health (got ${code:-no response})" >&2
            exit 1
          }
          echo "installed and healthy on $(uname -m)"

      - name: Upload the arm64 payload as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm64-payload-${{ github.sha }}
          path: |
            dist/arm64/*.tar.gz
            dist/arm64/*.sha256
            dist/arm64/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # The release manifest must exist before staging: stageReleaseArtifact
      # refuses without it, because a payload with no manifest cannot be
      # verified by the installer before extraction.
      - name: Build release manifest
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRISMA_VERSION=$(node -p "require('./node_modules/prisma/package.json').version")
          npx tsx scripts/release-manifest.ts build \
            release-manifest.json \
            "$VERSION" \
            "$(git rev-parse HEAD)" \
            "amd64" \
            "xistance-panel-v$VERSION-amd64.tar.gz" \
            apps/web/.next/standalone \
            "$PRISMA_VERSION"

      - name: Stage the release artifact
        run: npx tsx scripts/stage-release-artifact.ts . dist/artifact --architecture amd64

      # Ubuntu is a release target, so the artifact is booted directly -- no
      # host-engine fixture is needed and the results are about the real payload.
      - name: Browser gate (staged artifact)
        run: npm run test:browser

      - name: Upload browser gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-gate-evidence
          path: .agent/tmp-smoke/gate-*/
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Build + Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Validate Dockerfile
        run: docker build -t xistance-panel:ci .

      - name: Upload standalone build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xistance-standalone
          path: apps/web/.next/standalone
          if-no-files-found: warn
